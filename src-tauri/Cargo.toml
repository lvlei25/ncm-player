[package]
name = "ncm-player-tauri"
version = "0.1.0"
description = "黑胶音乐 Tauri 迁移壳（阶段 2：状态持久化与事件推送）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 纯 Rust D-Bus 实现，不依赖系统 libdbus 开发库
zbus = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
