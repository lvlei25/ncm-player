appId: com.ncm.player
productName: 黑胶音乐
copyright: ncm-player
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  # 渲染层与主进程都已打包成单文件，运行期不需要任何 node_modules
  - "!node_modules/**"
  - "!**/*.map"
extraResources:
  - from: build/icon.png
    to: icon.png
  # 托盘单色符号（明暗两套 + @2x），Electron 会自动合成高 DPI 表示
  - from: build/tray-dark.png
    to: tray-dark.png
  - from: build/tray-dark@2x.png
    to: tray-dark@2x.png
  - from: build/tray-light.png
    to: tray-light.png
  - from: build/tray-light@2x.png
    to: tray-light@2x.png
extraMetadata:
  main: dist-electron/main.cjs
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  # 多尺寸目录：GNOME dock / Wayland 会按实际 DPI 取用最合适的一档
  icon: build/icons
  executableName: ncm-player
  desktop:
    # 实测窗口 WM_CLASS 为可执行文件名，必须与之对齐，否则 dock 会另起一个无图标的条目
    StartupWMClass: ncm-player
  maintainer: ncm-player
  synopsis: 网易云音乐桌面播放器
  description: 基于 ncm-cli 的网易云音乐桌面播放器，支持搜索、歌单、歌词与 AI 点歌。
deb:
  depends:
    - mpv
  # 安装后修正 chrome-sandbox 的 SUID 权限，否则从应用列表启动会直接崩溃
  afterInstall: build/postinst.sh
