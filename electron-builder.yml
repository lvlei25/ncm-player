appId: com.ncm.player
productName: 黑胶音乐
copyright: ncm-player
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
extraMetadata:
  main: dist-electron/main.cjs
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  # 多尺寸目录：GNOME dock / Wayland 会按实际 DPI 取用最合适的一档
  icon: build/icons
  maintainer: ncm-player
  synopsis: 网易云音乐桌面播放器
  description: 基于 ncm-cli 的网易云音乐桌面播放器，支持搜索、歌单、歌词与 AI 点歌。
deb:
  depends:
    - mpv
